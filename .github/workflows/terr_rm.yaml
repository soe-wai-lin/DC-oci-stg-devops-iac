                  region: ap-singapore-1
                  access_key_id: ${{ secrets.OCI_ACCESSKEYID }}
                  secret_access_key: ${{ secrets.OCI_SECRETACCESSKEY }}
                  insecure: false
              
          gateway:
            enabled: false
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          
          EOF

          cat loki-custom-values.yaml
          helm upgrade --install loki grafana/loki \
          --namespace monitoring -f loki-custom-values.yaml

