      - name: Install NGINX Ingress Controller
        run: |
          export KUBECONFIG="$HOME/.kube/config"

          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -

          # Add repo if not already added
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
          helm repo update

          # Skip install if already exists
          if helm status ingress-nginx-new -n ingress-nginx > /dev/null 2>&1; then
            echo "ingress-nginx-new already installed, skipping..."
          else
            echo "Installing ingress-nginx-new..."

            helm upgrade --install ingress-nginx-new ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --set controller.name=custom-nginx \
            --set controller.ingressClassResource.name=custom-nginx \
            --set controller.ingressClass=custom-nginx \
            --set controller.electionID=custom-nginx-leader \
            --set controller.service.type=LoadBalancer \
            --set controller.publishService.enabled=true \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/oci-load-balancer-subnet1"="${LB_SUBNET_OCID}" \
            --set controller.service.annotations."oci\.oraclecloud\.com/oci-network-security-groups"="${LB_NSG_OCID}" \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/oci-load-balancer-security-list-management-mode"="None" \
            --set controller.service.annotations."oci\.oraclecloud\.com/load-balancer-type"="lb"
          fi

