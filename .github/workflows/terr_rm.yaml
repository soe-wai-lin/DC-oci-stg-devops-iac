      - name: Apply DevOps-managed Prometheus Internal LoadBalancer 
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"

          cat <<EOF > prometheus-lb-service.yaml
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: prometheus-lb
            namespace: monitoring
            annotations:
              oci.oraclecloud.com/load-balancer-type: "lb"
              service.beta.kubernetes.io/oci-load-balancer-internal: "true"
              service.beta.kubernetes.io/oci-load-balancer-subnet1: "${LB_SUBNET_OCID}"
              oci.oraclecloud.com/oci-network-security-groups: "${LB_NSG_OCID}"
              service.beta.kubernetes.io/oci-load-balancer-security-list-management-mode: "None"
              service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
              service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
              service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "1000"
          spec:
            type: LoadBalancer
            selector:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
            ports:
              - name: http
                port: 9090
                targetPort: 9090
                protocol: TCP
          EOF
          cat prometheus-lb-service.yaml
          kubectl apply -f prometheus-lb-service.yaml
          kubectl -n monitoring get svc prometheus-lb -o wide

