          read:
            replicas: 0
          write:
            replicas: 0
          lokiCanary:
            enabled: false
          test:
            enabled: false

          loki:
            auth_enabled: false
            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
              retention_period: 720h   # 30 days
          
            compactor:
              retention_enabled: true
