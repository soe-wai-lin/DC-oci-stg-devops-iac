deploymentMode: SingleBinary

singleBinary:
  replicas: 1

  autoscaling:
    # -- Enable autoscaling
    enabled: true

  service:
    type: LoadBalancer

    annotations:

      oci.oraclecloud.com/load-balancer-type: "lb"

      service.beta.kubernetes.io/oci-load-balancer-internal: "true"

      oci.oraclecloud.com/oci-network-security-groups: "ocid1.networksecuritygroup.oc1.ap-singapore-1.aaaaaaaazp36gnkorhr5kmhithphvsaw7ca75yw77dzrzag7m6zj3iteytea"

      service.beta.kubernetes.io/oci-load-balancer-subnet1: "ocid1.subnet.oc1.ap-singapore-1.aaaaaaaa6ofzms5vzszg52x3zvubdogd463qqneeg7om3bdys7qqbype3qxa"

      service.beta.kubernetes.io/oci-load-balancer-security-list-management-mode: "None"

      service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"

      service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"

      service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "1000"
      
    ports:
      http:
        port: 3100
        targetPort: http

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

lokiCanary:
  enabled: false

test:
  enabled: false
    
loki:

  auth_enabled: false

  limits_config:
    allow_structured_metadata: true
    retention_period: 720h   # 30 days

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: filesystem

  distributor:
    otlp_config:
      default_resource_attributes_as_index_labels:
        - service.name
        - service.namespace
        - service.instance.id
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13

        index:
          prefix: index_
          period: 24h

  storage:

    type: s3

    use_thanos_objstore: false

    bucketNames:
      chunks: stg_loki_chunks_bucket
      ruler: stg_loki_ruler_bucket
      admin: stg_loki_admin_bucket

    s3:

      endpoint: sdu99mdvjlue.compat.objectstorage.ap-singapore-1.oci.customer-oci.com

      region: ap-singapore-1

      accessKeyId: 2566db95047398fff3ee9c1150ea6ca77164035e

      secretAccessKey: 2z3Djc5qTiFtWf6sBPI1d8NJ151E0vEPeSsszAErWuQ=

      s3ForcePathStyle: true

      insecure: false

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

