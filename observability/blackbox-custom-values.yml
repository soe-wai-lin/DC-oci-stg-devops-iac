config:
  modules:

    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        follow_redirects: true
        preferred_ip_protocol: ip4

    grpc_health:
      prober: grpc
      timeout: 5s
      grpc:
        tls: false     # because of "appProtocol: kubernetes.io/h2c" in the grpc Service definition
        preferred_ip_protocol: ip4